# SearXNG settings - Optimized for KI-Literacy
use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "searxng_secret_placeholder_change_me" # Matching docker-compose
  limiter: false # Disabled for local agent access

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

redis:
  url: redis://searxng-redis:6379/0

engines:
  - name: google
    engine: google
    shortcut: g
  - name: brave
    engine: brave
    shortcut: br
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: wikipedia
    engine: wikipedia
    shortcut: w

ui:
  theme: simple
  default_locale: "de"
