<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projektkarte</title><style>body{font:18px/1.6 system-ui;margin:0;background:#f5f7ef;color:#193c36}main{max-width:1000px;margin:auto;padding:36px}a{color:#1f7360}section{padding:22px 0;border-bottom:1px solid #d7e0d8}h1{line-height:1.1}h2{line-height:1.2}button,input,textarea{font:inherit;padding:10px}textarea{width:100%;min-height:100px}img{max-width:100%}@media print{button{display:none}}</style></head><body><main><h1>Projektkarte · KI & Data Science</h1><p>Arbeiten Sie zu zweit. Halten Sie Ihre erste Idee fest. <a href="AA_W01_Einstieg.html#w01-project-exercise">Zur Folie</a></p><form id="project"><section><label><b>Team</b><textarea name="0" placeholder="Zwei Teammitglieder"></textarea></label></section><section><label><b>Zielgruppe</b><textarea name="1" placeholder="Für wen?"></textarea></label></section><section><label><b>Problem</b><textarea name="2" placeholder="Welche konkrete Schwierigkeit?"></textarea></label></section><section><label><b>Ergebnis</b><textarea name="3" placeholder="Was soll vorliegen?"></textarea></label></section><section><label><b>Daten und Werkzeuge</b><textarea name="4" placeholder="Was ist nötig und verfügbar?"></textarea></label></section><section><label><b>Prüfung</b><textarea name="5" placeholder="Woran erkennen Sie ein brauchbares Ergebnis?"></textarea></label></section></form><p><button onclick="window.print()">Drucken</button> <button id="export">Als Text speichern</button></p><p>Einträge bleiben in dieser geöffneten Seite. Sichern Sie die Karte vor dem Schließen.</p><script>document.getElementById("export").onclick=()=>{const text=[...document.querySelectorAll("label")].map(l=>l.innerText+"\n"+l.querySelector("textarea").value).join("\n\n");const u=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="Projektkarte.txt";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></main></body></html>
