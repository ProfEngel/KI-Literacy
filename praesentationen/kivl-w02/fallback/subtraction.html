<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmeldung: Mockup-Editor</title><style>*{box-sizing:border-box}body{font:18px/1.5 system-ui;background:#f7f7f5;color:#182c33;margin:30px auto;max-width:1150px;padding:24px}h1{font-size:36px}h2{font-size:24px}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #aebcb7;border-radius:8px}button{background:#dcefe1;cursor:pointer}:focus-visible{outline:3px solid #24666a}article,.panel{background:white;border:1px solid #d8e0d9;border-radius:18px;padding:22px;margin:16px 0;box-shadow:5px 8px 18px #193b3d12}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:24px}label{display:block;margin:12px 0}pre{white-space:pre-wrap;font:inherit}.note{color:#61726f}.field{border:1px dashed #9caea5;padding:12px;border-radius:12px;margin:10px 0}.field input[type=text]{width:100%}.bar{height:24px;background:#24666a;margin:8px 0}.flex{display:flex;gap:10px;flex-wrap:wrap}a{color:#24666a}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><p><a href="../AA_W02_Fundamente.html">← W02</a></p><h1>Anmeldung: Mockup-Editor</h1><p class="note">Vorbereitetes Rückfallbeispiel · synthetische Lehrsimulation, kein echtes LLM.</p><p>Fiktiver kostenloser Campus-Workshop. Keine echte Anmeldung.</p><div class="grid"><article><h2>Bausteine</h2><div id="palette" class="flex"></div><label>Variante <select id="variant"><option>A · ergänzen</option><option>B · vereinfachen</option></select></label><label>Hintergrund <input id="bg" type="color" value="#f7f7f5"></label><label>Text <input id="ink" type="color" value="#182c33"></label><label>Button <input id="accent" type="color" value="#24666a"></label><button id="check">Kriterien prüfen</button> <button id="reset">Reset</button><p><button id="json">JSON exportieren</button> <button id="html">HTML exportieren</button></p><button id="review">Prüfprompt erstellen</button><pre id="report" role="status">Bausteine ziehen oder anklicken.</pre></article><article id="preview"><h2>Vorschau / Editor</h2><p class="note">Labels ändern · ziehen oder ↑/↓ · Entfernen mit ×</p><div id="fields"></div></article></div><label>Begründung <textarea id="reason" rows="3" style="width:100%"></textarea></label><label>Prüfauftrag mit Konfiguration <textarea id="reviewtext" rows="7" style="width:100%" readonly></textarea></label><script>const types=['Titel','Vorname','Nachname','E-Mail','E-Mail-Wiederholung','Telefonnummer','Postanschrift','Geburtsdatum','Newsletter-Opt-in','Datenschutzhinweis','Anmeldung-Button','Hilfetext','Fortschritt'];let seq=0;const fresh=()=>types.slice(0,11).map(t=>({id:++seq,type:t,label:t,required:['Vorname','Nachname','E-Mail','E-Mail-Wiederholung'].includes(t)}));const configs=[{fields:fresh(),bg:'#f7f7f5',ink:'#182c33',accent:'#24666a'},{fields:fresh(),bg:'#f7f7f5',ink:'#182c33',accent:'#24666a'}];const current=()=>configs[document.getElementById('variant').selectedIndex],el=document.getElementById('fields');function render(){const c=current();document.getElementById('preview').style.background=c.bg;document.getElementById('preview').style.color=c.ink;for(const k of ['bg','ink','accent'])document.getElementById(k).value=c[k];el.replaceChildren();c.fields.forEach((f,i)=>{const row=document.createElement('div');row.className='field';row.draggable=true;row.dataset.id=f.id;row.ondragstart=e=>e.dataTransfer.setData('text/plain','id:'+f.id);const input=document.createElement('input');input.type='text';input.value=f.label;input.setAttribute('aria-label','Label '+f.type);input.oninput=()=>f.label=input.value;row.append(input);const req=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=f.required;cb.onchange=()=>f.required=cb.checked;req.append(cb,document.createTextNode(' Pflichtbaustein'));row.append(req);[['↑',-1],['↓',1],['×',0]].forEach(([label,move])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',f.type+(move?' verschieben':' entfernen'));b.onclick=()=>{if(!move)c.fields.splice(i,1);else{const j=i+move;if(j>=0&&j<c.fields.length)[c.fields[i],c.fields[j]]=[c.fields[j],c.fields[i]];}render();};row.append(b);});if(f.type==='Anmeldung-Button')row.style.borderColor=c.accent;el.append(row);});}types.forEach(t=>{const b=document.createElement('button');b.textContent='+ '+t;b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain','type:'+t);b.onclick=()=>{current().fields.push({id:++seq,type:t,label:t,required:false});render();};document.getElementById('palette').append(b);});el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const payload=e.dataTransfer.getData('text/plain'),target=e.target.closest('.field'),c=current(),pos=target?c.fields.findIndex(f=>f.id===+target.dataset.id):c.fields.length;if(payload.startsWith('type:'))c.fields.splice(pos,0,{id:++seq,type:payload.slice(5),label:payload.slice(5),required:false});else if(payload.startsWith('id:')){const i=c.fields.findIndex(f=>f.id===+payload.slice(3));if(i<0)return;const [f]=c.fields.splice(i,1);c.fields.splice(Math.min(pos,c.fields.length),0,f);}render();};document.getElementById('variant').onchange=render;for(const k of ['bg','ink','accent'])document.getElementById(k).oninput=e=>{current()[k]=e.target.value;render();};function lum(hex){const rgb=hex.match(/\w\w/g).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];}function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function report(){const c=current(),f=c.fields,t=f.map(x=>x.type),lines=['Didaktischer Check, kein Nutzertest oder Rechtsurteil.'];lines.push(t.filter(x=>x==='E-Mail').length===1?'✓ Genau ein E-Mail-Feld.':'FEHLER: genau ein E-Mail-Feld nötig.');lines.push(t.includes('Datenschutzhinweis')?'✓ Datenschutzhinweis erhalten.':'FEHLER: Datenschutzhinweis fehlt.');lines.push(t.includes('Anmeldung-Button')?'✓ Aktion vorhanden.':'FEHLER: Aktion fehlt.');lines.push(t.includes('E-Mail-Wiederholung')?'Doppelte Erfassung prüfen.':'✓ Keine Wiederholung.');lines.push('Datensparsamkeit: '+t.filter(x=>['Telefonnummer','Postanschrift','Geburtsdatum'].includes(x)).join(', '));lines.push('Pflichtbausteine: '+f.filter(x=>x.required).length);lines.push('Textkontrast: '+ratio(c.bg,c.ink).toFixed(2)+':1 '+(ratio(c.bg,c.ink)>=4.5?'✓':'FEHLER'));lines.push('Buttonkontrast (weiß): '+ratio(c.accent,'#ffffff').toFixed(2)+':1 '+(ratio(c.accent,'#ffffff')>=4.5?'✓':'FEHLER'));return lines.join(String.fromCharCode(10));}document.getElementById('check').onclick=()=>document.getElementById('report').textContent=report();document.getElementById('reset').onclick=()=>{Object.assign(current(),{fields:fresh(),bg:'#f7f7f5',ink:'#182c33',accent:'#24666a'});render();};function download(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}document.getElementById('json').onclick=()=>download('anmeldung-konfiguration.json',JSON.stringify(configs,null,2),'application/json');function safe(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll(String.fromCharCode(34),'&quot;');}document.getElementById('html').onclick=()=>{const c=current(),fields=c.fields.map(f=>{const label=safe(f.label);if(f.type==='Titel')return '<h1>'+label+'</h1>';if(['Datenschutzhinweis','Hilfetext','Fortschritt'].includes(f.type))return '<p>'+label+'</p>';if(f.type==='Anmeldung-Button')return '<button type="button" style="background:'+c.accent+';color:white">'+label+' (nur Mockup)</button>';if(f.type==='Newsletter-Opt-in')return '<label><input type="checkbox">'+label+'</label>';return '<label>'+label+'<input disabled placeholder="Mockup"></label>';}).join('');download('anmeldung-mockup.html','<!doctype html><html lang="de"><meta charset="utf-8"><title>Anmeldung Mockup</title><style>body{font:20px system-ui;margin:40px auto;padding:25px;max-width:700px;background:'+c.bg+';color:'+c.ink+'}label{display:block;margin:15px}input,button{padding:12px;border-radius:12px}</style><p>Nur Mockup, keine Anmeldung.</p>'+fields+'</html>','text/html');};document.getElementById('review').onclick=()=>{document.getElementById('reviewtext').value='Beurteile dieses fiktive Anmelde-Mockup. Trenne Befunde, Annahmen und nicht prüfbare Punkte. Prüfe Zweck, Datenminimierung, Klarheit, Kontrast und notwendige Bausteine. Kein Rechtsurteil und keine pauschale Note. Drei konkrete Verbesserungen und ein Gegenbeispiel-Test.'+String.fromCharCode(10)+JSON.stringify(current(),null,2)+String.fromCharCode(10)+report()+String.fromCharCode(10)+'Unsere Begründung: '+document.getElementById('reason').value;};render();</script></html>
