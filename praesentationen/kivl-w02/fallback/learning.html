<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zwei Regeln, dieselben Trainingsdaten</title><style>*{box-sizing:border-box}body{font:18px/1.5 system-ui;background:#f7f7f5;color:#182c33;margin:30px auto;max-width:1150px;padding:24px}h1{font-size:36px}h2{font-size:24px}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #aebcb7;border-radius:8px}button{background:#dcefe1;cursor:pointer}:focus-visible{outline:3px solid #24666a}article,.panel{background:white;border:1px solid #d8e0d9;border-radius:18px;padding:22px;margin:16px 0;box-shadow:5px 8px 18px #193b3d12}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:24px}label{display:block;margin:12px 0}pre{white-space:pre-wrap;font:inherit}.note{color:#61726f}.field{border:1px dashed #9caea5;padding:12px;border-radius:12px;margin:10px 0}.field input[type=text]{width:100%}.bar{height:24px;background:#24666a;margin:8px 0}.flex{display:flex;gap:10px;flex-wrap:wrap}a{color:#24666a}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><p><a href="../AA_W02_Fundamente.html">← W02</a></p><h1>Zwei Regeln, dieselben Trainingsdaten</h1><p class="note">Vorbereitetes Rückfallbeispiel · synthetische Lehrsimulation, kein echtes LLM.</p><article><h2>Training</h2><p>Rot/Kreis, Rot/Quadrat, Rot/Dreieck → A<br>Blau/Kreis, Blau/Quadrat, Blau/Dreieck → B</p><p>Beide Regeln treffen alle sechs Beispiele.</p><label>Regel <select id="rule"><option value="r1">R1: Rot→A, sonst→B</option><option value="r2">R2: Blau→B, sonst→A</option></select></label><button id="test">Regel festlegen und Test aufdecken</button> <button id="reset">Reset</button></article><article id="result" hidden></article><script>document.getElementById('test').onclick=()=>{const r=document.getElementById('rule').value,cases=[['Grün/Kreis','B'],['Gelb/Quadrat','B'],['Rot/Stern','A'],['Blau/Stern','B']],predictions=r==='r1'?['B','B','A','B']:['A','A','A','B'];document.getElementById('rule').disabled=true;const out=document.getElementById('result');out.hidden=false;out.innerHTML='<h2>Testkarten</h2>'+cases.map((c,i)=>'<p>'+c[0]+': Referenz '+c[1]+', Regel '+predictions[i]+' → '+(c[1]===predictions[i]?'Treffer':'Fehler')+'</p>').join('')+'<strong>'+(r==='r1'?'4':'2')+' / 4 Testtreffer</strong><p>Die Referenz folgt didaktisch R1. Sie war aus den Trainingskarten nicht eindeutig ableitbar.</p>';};document.getElementById('reset').onclick=()=>{document.getElementById('rule').disabled=false;document.getElementById('result').hidden=true;};</script></html>
