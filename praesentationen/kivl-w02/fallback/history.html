<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeitreise der KI</title><style>*{box-sizing:border-box}body{font:18px/1.5 system-ui;background:#f7f7f5;color:#182c33;margin:30px auto;max-width:1150px;padding:24px}h1{font-size:36px}h2{font-size:24px}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #aebcb7;border-radius:8px}button{background:#dcefe1;cursor:pointer}:focus-visible{outline:3px solid #24666a}article,.panel{background:white;border:1px solid #d8e0d9;border-radius:18px;padding:22px;margin:16px 0;box-shadow:5px 8px 18px #193b3d12}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:24px}label{display:block;margin:12px 0}pre{white-space:pre-wrap;font:inherit}.note{color:#61726f}.field{border:1px dashed #9caea5;padding:12px;border-radius:12px;margin:10px 0}.field input[type=text]{width:100%}.bar{height:24px;background:#24666a;margin:8px 0}.flex{display:flex;gap:10px;flex-wrap:wrap}a{color:#24666a}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><p><a href="../AA_W02_Fundamente.html">← W02</a></p><h1>Zeitreise der KI</h1><p class="note">Vorbereitetes Rückfallbeispiel · synthetische Lehrsimulation, kein echtes LLM.</p><div id="events"></div><h2>Zuordnung prüfen</h2><p>In welchem Jahr erschien die Transformer-Publikation?</p><button data-year="2012">2012</button> <button data-year="2017">2017</button><p id="feedback" role="status"></p><script>const events=[['1955','Antrag für Dartmouth'],['1956','Dartmouth-Sommerprojekt'],['2012','AlexNet / Bildklassifikation'],['2017','Transformer / Architektur'],['2022','ChatGPT / Anwendung']];document.getElementById('events').innerHTML=events.map(([y,t])=>'<details class="panel"><summary>'+y+' · '+t+'</summary><p>Antrag, Forschungsprojekt, Modell, Architektur oder Anwendung: unterschiedliche Typen von Meilensteinen. Die Abstände sind schematisch.</p></details>').join('');document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>document.getElementById('feedback').textContent=b.dataset.year==='2017'?'Richtig: Attention Is All You Need erschien 2017.':'2012 steht hier für AlexNet, nicht für den Transformer.');</script></html>
