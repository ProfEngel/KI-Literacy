<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W05 · Kurzer Benutzungstest</title><link rel="stylesheet" href="../assets/css/material.css"><main><h1>Nicht erklären. Beobachten.</h1><p>Eine andere Person testet. Keine Namen, Bewertungen von Personen oder echten Kundendaten. Kein Versand. Angaben bleiben nur bis zum Neuladen auf dieser Seite; Text bei Bedarf kopieren.</p><form id="feedback"><label>Was ist die wichtigste Aufgabe dieser Anwendung?<textarea name="task"></textarea></label><fieldset><legend>Erledigt ohne Erklärung?</legend><label>Hauptaktion gefunden<select name="main"><option>Noch nicht getestet</option><option>Ja, ohne Hilfe</option><option>Mit Hilfe</option><option>Nein</option></select></label><label>Fehler korrigiert<select name="error"><option>Noch nicht getestet</option><option>Ja, ohne Hilfe</option><option>Mit Hilfe</option><option>Nein</option></select></label><label>Erweiterte Option gefunden<select name="extra"><option>Noch nicht getestet</option><option>Ja, ohne Hilfe</option><option>Mit Hilfe</option><option>Nein</option></select></label></fieldset><label>Wo stockte es? Was war unklar?<textarea name="obstacle"></textarea></label><label>Eine konkrete Verbesserung<textarea name="next"></textarea></label><button type="button" id="save">Als TXT herunterladen</button><button type="reset">Zurücksetzen</button></form></main><script>document.querySelector('#save').onclick=()=>{const text=[...new FormData(document.querySelector('form'))].map(([k,v])=>k+': '+v).join('\n');const u=URL.createObjectURL(new Blob([text],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download='W05_Feedback.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></html>
